[pytest]
# One command checks the whole course:  python -m pytest
#   tests/      a test for every notebook, doc, data file and script
#   practice/   auto-graded exercises (add --solutions to grade the reference answers)
#   */tests/    unit tests of the installable project packages
testpaths =
    tests
    practice/tests
    intermediate/projects/task_manager_package/tests
    advanced/projects/event_processor_package/tests
pythonpath =
    intermediate/projects/task_manager_package/src
    advanced/projects/event_processor_package/src
addopts = --import-mode=importlib -rfE
