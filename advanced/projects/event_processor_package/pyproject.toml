[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-event-processor"
version = "0.1.0"
description = "Educational SQLite event processor with idempotency and a CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
advanced-events = "event_processor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
