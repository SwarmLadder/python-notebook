[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intermediate-task-manager"
version = "0.1.0"
description = "Educational SQLite task manager CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
intermediate-tasks = "task_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
