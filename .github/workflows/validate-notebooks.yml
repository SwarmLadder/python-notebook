name: Validate Python learning notebooks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install "pytest>=7.0"
      - name: Test every notebook, doc, data file, script and project package
        run: python -m pytest
      - name: Grade the reference solutions with the practice tests
        run: python -m pytest practice --solutions
      - name: Legacy smoke tests
        run: |
          python tools/validate_notebooks.py
          python tools/smoke_test_intermediate.py
          python tools/smoke_test_advanced.py
